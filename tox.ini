[tox]
# NB: no `requires` here -- it makes tox provision an isolated environment that
# would not contain the tox-py plugin CI drives with `tox --py current`.
isolated_build = true
envlist =
    py311-dj52-cms{50,51}-{default,versioning}
    py{314,315}-dj61-cms50-{default,versioning}
    py{312,313,314,315}-dj{52,60,61}-cms51-{default,versioning}

skip_missing_interpreters=True

labels =
    compile = compile-py311, compile-py312, compile-py313, compile-py314, compile-py315

[testenv]
setenv =
    versioning: ENABLE_VERSIONING = 1
deps = -r tests/requirements/{envname}.txt

commands =
    {envpython} --version
    {env:COMMAND:coverage} run -m pytest

[testenv:compile-py{311,312,313,314,315}]
description = Recompile the pinned test requirements for this Python version
skip_install = true
deps =
    pip-tools
    # Older pip imports typing APIs removed in Python 3.15.
    py{311,312,313,314}: pip==24.3.1
    py315: pip>=26
commands = python {toxinidir}/tests/requirements/compile.py {posargs}

[testenv:flake8]
deps = flake8
commands = flake8

[testenv:isort]
deps = isort
commands = isort --check-only --diff {toxinidir}
skip_install = true
