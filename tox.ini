[tox]
requires =
    tox>=4.2
isolated_build = true
envlist =
    py{311,312,313,314}-dj{52}-cms50-{default,versioning}
    py{312,313,314}-dj{52,60}-cms50-{default,versioning}

skip_missing_interpreters=True

labels =
    compile = compile-py311, compile-py312, compile-py313, compile-py314

[testenv]
setenv =
    versioning: ENABLE_VERSIONING = 1
deps = -r tests/requirements/{envname}.txt

commands =
    {envpython} --version
    {env:COMMAND:coverage} run -m pytest

[testenv:compile-py{311,312,313,314}]
description = Recompile the pinned test requirements for this Python version
skip_install = true
deps =
    pip-tools
    pip==24.3.1
commands = python {toxinidir}/tests/requirements/compile.py {posargs}

[testenv:flake8]
deps = flake8
commands = flake8

[testenv:isort]
deps = isort
commands = isort --check-only --diff {toxinidir}
skip_install = true
